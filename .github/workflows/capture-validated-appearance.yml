name: Capture validated appearance build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PREVIEW_SOURCE_RUN: '44097852764'
  PREVIEW_SOURCE_COMMIT: 312620ea25a276d3bc17ef161a91ea32b90f8456
  PREVIEW_PATCH_SHA256: EDBB9D0154EB498D69F411A4AD7876477B488E8442FFC535B15A4F1E1615C371
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  capture:
    if: github.event.repository.private == false
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Get the corrected screenshot helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: kit
          persist-credentials: false
      - name: Download the already-built portable app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portable-appearance-preview
          github-token: ${{ github.token }}
          run-id: ${{ env.PREVIEW_SOURCE_RUN }}
          path: portable-preview
      - name: Download its passing test evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validation-appearance
          github-token: ${{ github.token }}
          run-id: ${{ env.PREVIEW_SOURCE_RUN }}
          path: prior-validation
      - name: Use the exact SDK from the passing build
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '11.0.100'
      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x64
      - name: Validate the source evidence and capture the real UI
        run: |
          New-Item -ItemType Directory -Path capture-workspace -Force | Out-Null
          Copy-Item -LiteralPath prior-validation/global.json -Destination capture-workspace/global.json
          & ./kit/.github/appearance/Publish-Preview.ps1 `
            -SourceRoot "$env:GITHUB_WORKSPACE/capture-workspace" `
            -PublishRoot "$env:GITHUB_WORKSPACE/portable-preview" `
            -ScreenshotsRoot "$env:GITHUB_WORKSPACE/screenshots" `
            -UseExistingPortable -ValidatedResultsRoot "$env:GITHUB_WORKSPACE/prior-validation"
      - name: Save screenshots and capture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appearance-capture-check
          path: |
            screenshots/
            results/
          retention-days: 7
          if-no-files-found: error
